<app-tool-page title="Text to Image" icon="bi-fonts"
    [error]="exportError()"
    blurb="Render styled text or syntax-highlighted code as a downloadable, printable image.">

    <div class="ti">
        <!-- Mode toggle -->
        <div class="t-tabs" role="tablist" aria-label="Mode">
            <button type="button" class="t-tab" [class.active]="mode() === 'plain'"
                (click)="setMode('plain')">Plain text</button>
            <button type="button" class="t-tab" [class.active]="mode() === 'code'"
                (click)="setMode('code')">Code</button>
        </div>

        @if (mode() === 'plain') {
        <div class="ti-grid">
            <!-- Controls -->
            <div class="ti-controls">
                <div>
                    <label class="t-label" for="tiText">Text</label>
                    <textarea id="tiText" class="t-textarea ti-text" spellcheck="false"
                        placeholder="Type your text…"
                        [ngModel]="text()" (ngModelChange)="text.set($event)"></textarea>
                </div>

                <div class="t-grid-2">
                    <div>
                        <label class="t-label" for="tiSize">Font size (px)</label>
                        <input id="tiSize" type="number" class="t-field" min="8" step="1"
                            [ngModel]="fontSize()" (ngModelChange)="fontSize.set($event)" />
                    </div>
                    <div>
                        <label class="t-label" for="tiFont">Font family</label>
                        <select id="tiFont" class="t-field"
                            [ngModel]="fontFamily()" (ngModelChange)="fontFamily.set($event)">
                            @for (f of fonts; track f) {
                            <option [value]="f">{{ f }}</option>
                            }
                        </select>
                    </div>
                </div>

                <div class="t-grid-2">
                    <div>
                        <label class="t-label" for="tiColor">Text colour</label>
                        <div class="ti-color">
                            <input id="tiColor" type="color" class="ti-color-input"
                                [ngModel]="fontColor()" (ngModelChange)="fontColor.set($event)" />
                            <input type="text" class="t-field" spellcheck="false"
                                [ngModel]="fontColor()" (ngModelChange)="fontColor.set($event)" />
                        </div>
                    </div>
                    <div>
                        <label class="t-label" for="tiBg">Background</label>
                        <div class="ti-color">
                            <input id="tiBg" type="color" class="ti-color-input" [disabled]="transparent()"
                                [ngModel]="bgColor()" (ngModelChange)="bgColor.set($event)" />
                            <input type="text" class="t-field" spellcheck="false" [disabled]="transparent()"
                                [ngModel]="bgColor()" (ngModelChange)="bgColor.set($event)" />
                        </div>
                        <label class="t-check ti-transparent">
                            <input type="checkbox" [checked]="transparent()"
                                (change)="transparent.set($any($event.target).checked)" />
                            Transparent
                        </label>
                    </div>
                </div>

                <div class="t-grid-2">
                    <div>
                        <label class="t-label" for="tiPad">Padding (px)</label>
                        <input id="tiPad" type="number" class="t-field" min="0" step="1"
                            [ngModel]="padding()" (ngModelChange)="padding.set($event)" />
                    </div>
                    <div>
                        <label class="t-label">Alignment</label>
                        <div class="t-tabs">
                            @for (a of aligns; track a) {
                            <button type="button" class="t-tab" [class.active]="align() === a"
                                (click)="align.set(a)">{{ a }}</button>
                            }
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview -->
            <div class="ti-preview-wrap">
                <label class="t-label">Preview</label>
                <div class="ti-canvas-box" [class.ti-canvas-box--checker]="transparent()">
                    <canvas #canvas class="ti-canvas"></canvas>
                </div>
            </div>
        </div>
        } @else {
        <div class="ci-grid">
            <!-- Controls -->
            <div class="ci-controls">
                <div>
                    <label class="t-label" for="ciCode">Code</label>
                    <textarea id="ciCode" class="t-textarea ci-code-input" spellcheck="false"
                        placeholder="Paste your code…"
                        [ngModel]="code()" (ngModelChange)="code.set($event)"></textarea>
                </div>

                <div class="t-grid-2">
                    <div>
                        <label class="t-label" for="ciLang">Language</label>
                        <select id="ciLang" class="t-field"
                            [ngModel]="language()" (ngModelChange)="language.set($event)">
                            @for (l of languages; track l.value) {
                            <option [value]="l.value">{{ l.label }}</option>
                            }
                        </select>
                    </div>
                    <div>
                        <label class="t-label" for="ciBg">Background</label>
                        <div class="ci-color">
                            <input id="ciBg" type="color" class="ci-color-input"
                                [ngModel]="codeBgColor()" (ngModelChange)="codeBgColor.set($event)" />
                            <input type="text" class="t-field" spellcheck="false"
                                [ngModel]="codeBgColor()" (ngModelChange)="codeBgColor.set($event)" />
                        </div>
                    </div>
                </div>

                <div class="t-grid-2">
                    <div>
                        <label class="t-label" for="ciPad">Padding (px)</label>
                        <input id="ciPad" type="number" class="t-field" min="0" step="1"
                            [ngModel]="codePadding()" (ngModelChange)="codePadding.set($event)" />
                    </div>
                    <div>
                        <label class="t-label" for="ciFont">Font size (px)</label>
                        <input id="ciFont" type="number" class="t-field" min="8" step="1"
                            [ngModel]="codeFontSize()" (ngModelChange)="codeFontSize.set($event)" />
                    </div>
                </div>

                <label class="t-check">
                    <input type="checkbox" [checked]="showWindowTitle()"
                        (change)="showWindowTitle.set($any($event.target).checked)" />
                    Show window bar
                </label>
            </div>

            <!-- Preview -->
            <div class="ci-preview-wrap">
                <label class="t-label">Preview</label>
                <div class="ci-preview">
                    <div #card class="ci-card" [style.background]="codeBgColor()">
                        @if (showWindowTitle()) {
                        <div class="ci-bar">
                            <span class="ci-dot ci-dot--r"></span>
                            <span class="ci-dot ci-dot--y"></span>
                            <span class="ci-dot ci-dot--g"></span>
                        </div>
                        }
                        <pre class="ci-pre" [style.padding.px]="codePadding()" [style.font-size.px]="codeFontSize()"><code
                                [innerHTML]="highlightedHtml()"></code></pre>
                    </div>
                </div>
            </div>
        </div>
        }

        <div class="t-actions">
            <button type="button" class="t-btn" (click)="downloadPng()" [disabled]="exporting()">
                <i class="bi" [class]="exporting() ? 'bi-hourglass-split' : 'bi-download'"></i>
                {{ exporting() ? 'Rendering…' : 'Download PNG' }}
            </button>
            @if (mode() === 'plain') {
            <button type="button" class="t-btn t-btn--ghost" (click)="print()">
                <i class="bi bi-printer"></i> Print
            </button>
            } @else {
            <button type="button" class="t-btn t-btn--ghost" (click)="copyHtml()">
                <i class="bi" [class]="copiedHtml() ? 'bi-check2' : 'bi-clipboard'"></i>
                {{ copiedHtml() ? 'Copied' : 'Copy highlighted HTML' }}
            </button>
            }
        </div>
    </div>
</app-tool-page>
