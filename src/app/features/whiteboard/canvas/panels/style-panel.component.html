@if (visible()) {
<div class="wb-panel" role="region" aria-label="Style properties">

    <!-- Stroke -->
    <section class="wb-panel-sec">
        <label class="wb-panel-label">Stroke</label>
        <app-color-field [swatches]="strokePalette" [value]="style().strokeColor"
            (colorChange)="setStroke($event)" />
    </section>

    <!-- Fill -->
    <section class="wb-panel-sec">
        <label class="wb-panel-label">Fill</label>
        <app-color-field [swatches]="fillPalette" [value]="style().fillColor" [allowTransparent]="true"
            (colorChange)="setFill($event)" />
    </section>

    <!-- Stroke width -->
    <section class="wb-panel-sec">
        <label class="wb-panel-label">Stroke width</label>
        <div class="wb-seg">
            @for (w of strokeWidths; track w) {
            <button type="button" class="wb-seg-btn" [class.active]="style().strokeWidth === w"
                (click)="setStrokeWidth(w)" [attr.aria-label]="w + 'px'">
                <span class="wb-width-preview" [style.height.px]="w"></span>
            </button>
            }
        </div>
    </section>

    <!-- Dash -->
    <section class="wb-panel-sec">
        <label class="wb-panel-label">Style</label>
        <div class="wb-seg">
            @for (d of dashOptions; track d.id) {
            <button type="button" class="wb-seg-btn" [class.active]="style().dash === d.id" (click)="setDash(d.id)"
                [attr.aria-label]="d.id">
                <i class="bi" [class]="d.icon"></i>
            </button>
            }
        </div>
    </section>

    <!-- Corner radius (rect only) -->
    @if (isRectLike()) {
    <section class="wb-panel-sec">
        <label class="wb-panel-label">Corners · {{ style().cornerRadius }}px</label>
        <input type="range" class="wb-range" min="0" max="64" [value]="style().cornerRadius"
            (input)="setCornerRadius($event)" (change)="commit()" />
    </section>
    }

    <!-- Opacity -->
    <section class="wb-panel-sec">
        <label class="wb-panel-label">Opacity · {{ opacityPercent() }}%</label>
        <input type="range" class="wb-range" min="10" max="100" [value]="opacityPercent()"
            (input)="setOpacity($event)" (change)="commit()" />
    </section>

    <!-- Text controls -->
    @if (textEl(); as t) {
    <div class="wb-panel-divider"></div>

    <section class="wb-panel-sec">
        <label class="wb-panel-label">Font</label>
        <select class="wb-select" [value]="t.type === 'text' ? t.fontFamily : themeFont"
            (change)="setFont($event)">
            @for (f of fonts; track f.value) {
            <option [value]="f.value">{{ f.label }}</option>
            }
        </select>
    </section>

    <section class="wb-panel-sec">
        <label class="wb-panel-label">Size · {{ t.fontSize }}px</label>
        <input type="range" class="wb-range" min="8" max="96" [value]="t.fontSize" (input)="setFontSize($event)"
            (change)="commit()" />
    </section>

    @if (asText(t); as tt) {
    <section class="wb-panel-sec">
        <label class="wb-panel-label">Format</label>
        <div class="wb-seg">
            <button type="button" class="wb-seg-btn" [class.active]="tt.fontWeight === 700" (click)="toggleBold()"
                aria-label="Bold"><i class="bi bi-type-bold"></i></button>
            <button type="button" class="wb-seg-btn" [class.active]="tt.italic" (click)="toggleItalic()"
                aria-label="Italic"><i class="bi bi-type-italic"></i></button>
            <button type="button" class="wb-seg-btn" [class.active]="tt.underline" (click)="toggleUnderline()"
                aria-label="Underline"><i class="bi bi-type-underline"></i></button>
        </div>
    </section>

    <section class="wb-panel-sec">
        <label class="wb-panel-label">Align</label>
        <div class="wb-seg">
            <button type="button" class="wb-seg-btn" [class.active]="tt.textAlign === 'left'"
                (click)="setAlign('left')" aria-label="Align left"><i class="bi bi-text-left"></i></button>
            <button type="button" class="wb-seg-btn" [class.active]="tt.textAlign === 'center'"
                (click)="setAlign('center')" aria-label="Align center"><i class="bi bi-text-center"></i></button>
            <button type="button" class="wb-seg-btn" [class.active]="tt.textAlign === 'right'"
                (click)="setAlign('right')" aria-label="Align right"><i class="bi bi-text-right"></i></button>
        </div>
    </section>

    <section class="wb-panel-sec">
        <label class="wb-panel-label">Text color</label>
        <app-color-field [swatches]="strokePalette" [value]="tt.color" (colorChange)="setTextColor($event)" />
    </section>
    }
    }
</div>
}
