@for (el of elements; track el.id) {
@if (isText(el)) {
<div class="wb-text-el" [class.editing]="isEditing(el.id)" [class.wb-text-el--fixed]="el.sizing === 'fixed'"
    [class.wb-text-el--filled]="el.style.fillColor !== 'transparent'" [attr.data-edit-id]="el.id"
    [attr.contenteditable]="isEditing(el.id)" spellcheck="false"
    [style.left.px]="el.x" [style.top.px]="el.y" [style.width.px]="el.width" [style.min-height.px]="el.height"
    [style.font-family]="el.fontFamily" [style.font-size.px]="el.fontSize" [style.font-weight]="el.fontWeight"
    [style.text-align]="el.textAlign" [style.transform]="tiltTransform(el)"
    [style.color]="el.color" [style.background-color]="el.style.fillColor" [style.opacity]="el.style.opacity"
    (pointerdown)="onPointerDown(el.id, $event)" (pointerup)="onPointerUp(el.id, $event)" (click)="onLinkClick($event)"
    (pointermove)="onPointerMove(el.id, $event)" (dblclick)="onDoubleClick(el.id, $event)"
    (input)="onInput(el.id, $event)" (keydown)="onKeyDown(el.id, $event)" (paste)="onPaste(el.id, $event)"
    (blur)="commitText(el.id, $event)" [innerHTML]="el.text"></div>
}
@if (isSticky(el)) {
<div class="wb-sticky-el" [class.editing]="isEditing(el.id)" [style.left.px]="el.x" [style.top.px]="el.y"
    [style.width.px]="el.width" [style.height.px]="el.height" [style.background]="el.fill"
    [style.opacity]="el.style.opacity" [style.transform]="tiltTransform(el)"
    (pointerdown)="onPointerDown(el.id, $event)" (pointerup)="onPointerUp(el.id, $event)"
    (pointermove)="onPointerMove(el.id, $event)" (dblclick)="onDoubleClick(el.id, $event)">
    <div class="wb-sticky-text" [class.editing]="isEditing(el.id)" [attr.data-edit-id]="el.id"
        [attr.contenteditable]="isEditing(el.id)" spellcheck="false"
        [style.font-family]="el.fontFamily" [style.font-size.px]="el.fontSize" [style.font-weight]="el.fontWeight"
        (keydown)="onKeyDown(el.id, $event)" (paste)="onPaste(el.id, $event)" (click)="onLinkClick($event)"
        (blur)="commitText(el.id, $event)" [innerHTML]="el.text"></div>
</div>
}

<!-- AI writing assistant: floats above whichever text/sticky box is being edited.
     mousedown is swallowed so clicking a button never blurs the contenteditable
     (same preventDefault trick the style panel's format buttons use). -->
@if (isEditing(el.id)) {
<div class="wb-ai-pill" role="toolbar" aria-label="AI writing assistant"
    [style.left.px]="el.x" [style.top.px]="el.y"
    (mousedown)="$event.preventDefault(); $event.stopPropagation()"
    (pointerdown)="$event.stopPropagation()" (dblclick)="$event.stopPropagation()">
    <i class="bi bi-stars" aria-hidden="true"></i>
    <button type="button" [disabled]="aiBusy() !== null" (click)="improveWriting(el.id, 'improve')">
        {{ aiBusy() === 'improve' ? 'Improving…' : 'Improve' }}
    </button>
    <button type="button" [disabled]="aiBusy() !== null" (click)="improveWriting(el.id, 'shorten')">
        {{ aiBusy() === 'shorten' ? 'Shortening…' : 'Shorten' }}
    </button>
    <button type="button" [disabled]="aiBusy() !== null" (click)="improveWriting(el.id, 'fix')">
        {{ aiBusy() === 'fix' ? 'Fixing…' : 'Fix' }}
    </button>
    @if (aiError()) { <span class="wb-ai-err" role="alert">AI unavailable</span> }
</div>
}
}
