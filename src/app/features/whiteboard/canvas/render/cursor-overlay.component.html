@for (c of screenCursors(); track c.socketId) {
<div class="wb-cursor" [style.left.px]="c.left" [style.top.px]="c.top">
    <svg width="18" height="18" viewBox="0 0 18 18" [style.fill]="c.color">
        <path d="M2 2 L2 14 L6 10 L9 16 L11 15 L8 9 L14 9 Z" stroke="rgba(0,0,0,.3)" stroke-width="0.5" />
    </svg>
    <span class="wb-cursor-label" [style.background]="c.color">{{ c.name }}</span>
</div>
}
